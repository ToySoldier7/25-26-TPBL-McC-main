<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" role="img" aria-label="모델 검증: GNN 오차가 기준 모델보다 높음"><title>모델 검증: GNN 오차가 기준 모델보다 높음</title><rect width="1000" height="610" fill="white"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="35" y="38" font-size="24" fill="#172739" text-anchor="start" font-weight="700">GNN은 두 검증에서 모두 단순 기준보다 오차가 컸다</text><text x="35" y="67" font-size="15" fill="#627084" text-anchor="start" font-weight="400">팀 득실 / 36분 예측 RMSE · 낮을수록 좋음 · 고정 설정의 탐색 실험</text><text x="35" y="112" font-size="18" fill="#172739" text-anchor="start" font-weight="700">경기별 5분할 · 24경기</text><text x="35" y="158" font-size="16" fill="#172739" text-anchor="start" font-weight="400">단순 평균</text><rect x="200" y="142" width="526.4443289018623" height="25" rx="3" fill="#225ac7" opacity="0.72"/><text x="736.4443289018623" y="161" font-size="17" fill="#172739" text-anchor="start" font-weight="700">70.19</text><text x="35" y="201" font-size="16" fill="#172739" text-anchor="start" font-weight="400">Ridge</text><rect x="200" y="185" width="526.3134660780548" height="25" rx="3" fill="#225ac7" opacity="0.72"/><text x="736.3134660780548" y="204" font-size="17" fill="#172739" text-anchor="start" font-weight="700">70.18</text><text x="35" y="244" font-size="16" fill="#172739" text-anchor="start" font-weight="400">엣지 제거 NN</text><rect x="200" y="228" width="554.2200902727534" height="25" rx="3" fill="#225ac7" opacity="0.72"/><text x="764.2200902727534" y="247" font-size="17" fill="#172739" text-anchor="start" font-weight="700">73.90</text><text x="35" y="287" font-size="16" fill="#172739" text-anchor="start" font-weight="400">관계형 GNN</text><rect x="200" y="271" width="595.9147561488456" height="25" rx="3" fill="#ad5720" opacity="1"/><text x="805.9147561488456" y="290" font-size="17" fill="#172739" text-anchor="start" font-weight="700">79.46</text><text x="35" y="347" font-size="18" fill="#172739" text-anchor="start" font-weight="700">시간순 검증 · 마지막 8경기</text><text x="35" y="393" font-size="16" fill="#172739" text-anchor="start" font-weight="400">단순 평균</text><rect x="200" y="377" width="487.4841475489486" height="25" rx="3" fill="#225ac7" opacity="0.72"/><text x="697.4841475489486" y="396" font-size="17" fill="#172739" text-anchor="start" font-weight="700">65.00</text><text x="35" y="436" font-size="16" fill="#172739" text-anchor="start" font-weight="400">Ridge</text><rect x="200" y="420" width="487.5537683243626" height="25" rx="3" fill="#225ac7" opacity="0.72"/><text x="697.5537683243626" y="439" font-size="17" fill="#172739" text-anchor="start" font-weight="700">65.01</text><text x="35" y="479" font-size="16" fill="#172739" text-anchor="start" font-weight="400">엣지 제거 NN</text><rect x="200" y="463" width="543.4515032197188" height="25" rx="3" fill="#225ac7" opacity="0.72"/><text x="753.4515032197188" y="482" font-size="17" fill="#172739" text-anchor="start" font-weight="700">72.46</text><text x="35" y="522" font-size="16" fill="#172739" text-anchor="start" font-weight="400">관계형 GNN</text><rect x="200" y="506" width="604.4051204916067" height="25" rx="3" fill="#ad5720" opacity="1"/><text x="814.4051204916067" y="525" font-size="17" fill="#172739" text-anchor="start" font-weight="700">80.59</text><text x="35" y="577" font-size="15" fill="#627084" text-anchor="start" font-weight="400">GNN의 외삽 순위는 주결론에서 제외. 신경망 전체의 불가능성을 뜻하지는 않음.</text></g></svg>