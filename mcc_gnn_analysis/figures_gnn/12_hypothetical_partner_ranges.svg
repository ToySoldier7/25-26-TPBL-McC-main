  <g id="text_20">
   <text style="font-weight: 700; font-size: 22px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #172739" x="53.46" y="43.269375" transform="rotate(-0 53.46 43.269375)">가상 파트너 교체: 평균보다 넓은 모델 간 변동</text>
  </g>
  <g id="text_21">
   <text style="font-size: 11px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #6c7b8e" x="53.46" y="61.2" transform="rotate(-0 53.46 61.2)">탐색 전용 · 기존 외국인 파트너를 후보로 바꾼 GNN 출력 변화 · 검증 성능 우위 없음</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'Malgun Gothic'; fill: #6c7b8e" transform="translate(53.46 558.170469)">점=5개 경기 재표집 모델 평균 · 선=5개 모델의 최소~최대. 95% 신뢰구간·예상 영입 효과가 아닙니다.</text>
   <text style="font-size: 10px; font-family: 'Malgun Gothic'; fill: #6c7b8e" transform="translate(53.46 573.870469)">후보별 평가 맥락 수(n)가 다릅니다. GNN 검증 실패로 이 순위를 추천 근거에 채택하지 않았습니다.</text>
  </g>
