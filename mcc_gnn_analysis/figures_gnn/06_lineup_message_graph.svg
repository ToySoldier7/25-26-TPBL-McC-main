  <g id="text_15">
   <text style="font-size: 10px; font-family: 'Malgun Gothic'; fill: #6c7b8e" transform="translate(53.46 490.154688)">화살표는 메시지의 수신 방향이며 어시스트·패스 기록이 아닙니다. 실제 모델에서는 모든 노드가 메시지를 받습니다.</text>
   <text style="font-size: 10px; font-family: 'Malgun Gothic'; fill: #6c7b8e" transform="translate(53.46 506.196094)">그림은 맥컬러의 수신 엣지만 표시합니다. 노드 위치는 도식적 배치입니다.</text>
